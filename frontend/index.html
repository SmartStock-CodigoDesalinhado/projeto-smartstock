<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — SmartStock</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="login-page">
    <header class="topbar login-topbar">
        <a class="brand" href="index.html"><span class="brand-icon">⬡</span><span>Smart<span class="orange">Stock</span></span></a>
        <span class="green-line"></span>
        <nav class="site-links"><a href="#recursos">RECURSOS</a><a href="mailto:suporte@smartstock.com">SUPORTE</a><a href="#sobre">SOBRE</a><a href="mailto:contato@smartstock.com">CONTATO</a></nav>
    </header>
    <main class="login-layout">
        <div class="photo-side left-photo" role="img" aria-label="Operador organizando produtos no armazém"></div>
        <section class="login-center">
            <div class="login-symbol" aria-hidden="true">⬡<span>▂▅▇</span></div>
            <div class="login-wordmark">Smart<span class="orange">Stock</span></div>
            <h1>Bem-vindo ao SmartStock</h1>
            <p class="subtitle">Faça login para acessar o sistema de gestão de estoque.</p>
            <form id="loginForm">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" maxlength="50" autocomplete="username" placeholder="Digite seu e-mail" required>
                <label for="senha">Senha</label>
                <div class="password-field"><input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required><button type="button" id="toggleSenha" aria-label="Mostrar senha">◉</button></div>
                <button class="primary-btn" type="submit" id="entrar">➜ &nbsp; ENTRAR</button>
            </form>
            <p id="mensagem" class="feedback" role="status" aria-live="polite"></p>
        </section>
        <div class="photo-side right-photo" role="img" aria-label="Gestora acompanhando o estoque com tablet"></div>
    </main>
    <footer class="footer"><span><strong>SmartStock</strong> • Sistema de Controle de Estoque<br><small>Organize. Controle. Faça seu estoque render mais.</small></span><span>© SmartStock • Projeto TCC</span></footer>
</body>
</html>
